# Host paths and the dashboard's bind address come from environment variables or a
# .env file next to this one, so the same file runs locally and on a server
# (see deploy/cpouta/). Defaults suit a local checkout.
#
#   TRAM_DATA_DIR   host folder holding raw/ and processed/   (default ./data)
#   TRAM_MODELS_DIR host folder for trained models             (default ./models)
#   DASHBOARD_BIND  address the dashboard listens on           (default 127.0.0.1, this machine only)
#   TRAM_PUBLIC_HOST, COMPOSE_PROFILES=public
#                   serve the dashboard over HTTPS at this hostname through Caddy (server only)

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  ingest:
    build: .
    command: python -m tram_mlops.ingest
    restart: unless-stopped
    logging: *logging
    # If memory runs out, the kernel should kill anything but the collector.
    oom_score_adj: -500
    volumes:
      - ${TRAM_DATA_DIR:-./data}/raw:/app/data/raw

  dashboard:
    build: .
    restart: unless-stopped
    logging: *logging
    # Caps what heavy traffic can take from the collector; Docker restarts it if exceeded.
    mem_limit: 1g
    environment:
      TRAM_DASHBOARD_PROCESS_ON_DEMAND: ${TRAM_DASHBOARD_PROCESS_ON_DEMAND:-true}
    ports:
      - "${DASHBOARD_BIND:-127.0.0.1}:8501:8501"
    volumes:
      - ${TRAM_DATA_DIR:-./data}/raw:/app/data/raw:ro
      - ${TRAM_DATA_DIR:-./data}/processed:/app/data/processed
      - ${TRAM_MODELS_DIR:-./models}:/app/models:ro

  # HTTPS reverse proxy with automatic Let's Encrypt certificates (deploy/Caddyfile).
  caddy:
    image: caddy:2.10-alpine
    profiles: ["public"]
    restart: unless-stopped
    logging: *logging
    mem_limit: 128m
    depends_on: [dashboard]
    ports:
      - "443:443"
    environment:
      TRAM_PUBLIC_HOST: ${TRAM_PUBLIC_HOST:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Hourly from tram-process.timer (deploy/cpouta/): gzip raw days older than yesterday,
  # then rebuild only the day partitions whose raw file changed. A full day peaks at ~0.8 GB.
  process:
    build: .
    command: python -m tram_mlops.process --compact
    profiles: ["jobs"]
    logging: *logging
    mem_limit: 1200m
    # If memory runs short, this job is the one to go; the next run redoes its day.
    oom_score_adj: 500
    volumes:
      - ${TRAM_DATA_DIR:-./data}/raw:/app/data/raw
      - ${TRAM_DATA_DIR:-./data}/processed:/app/data/processed

  # One-off: docker compose run --rm pipeline
  pipeline:
    build: .
    command: sh -c "python -m tram_mlops.process && python -m tram_mlops.train"
    profiles: ["jobs"]
    logging: *logging
    volumes:
      - ${TRAM_DATA_DIR:-./data}/raw:/app/data/raw:ro
      - ${TRAM_DATA_DIR:-./data}/processed:/app/data/processed
      - ${TRAM_MODELS_DIR:-./models}:/app/models

volumes:
  caddy_data:     # certificates; keep them to stay within Let's Encrypt rate limits
  caddy_config:
