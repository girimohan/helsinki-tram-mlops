[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tram-mlops"
version = "0.1.0"
description = "Collect Helsinki tram positions, analyse delays and forecast them."
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=2.0",
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn>=1.6",
    "joblib>=1.3",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# README figures and dashboard screenshots (scripts/)
docs = ["matplotlib>=3.8", "playwright>=1.45"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
