[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tram-mlops"
version = "0.1.0"
description = "Collect Helsinki tram positions, analyse delays and forecast them."
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=2.0",
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn>=1.6",
    "joblib>=1.3",
    "streamlit>=1.40",
    "numpy>=2",
    "pydeck>=0.9",
    "duckdb>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.15", "mypy>=1.15", "pandas-stubs", "pre-commit>=4"]
# README figures and dashboard screenshots (scripts/)
docs = ["matplotlib>=3.8", "playwright>=1.45"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade, simplify
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["tram_mlops"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# No type information published for these.
module = ["sklearn.*", "joblib.*", "pydeck.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["tram_mlops"]
# The dashboard is exercised by tests/test_dashboard.py through Streamlit's AppTest,
# which runs the script in a way coverage cannot trace, so it would always read 0%.
omit = ["*/tram_mlops/dashboard.py"]

[tool.coverage.report]
fail_under = 80
