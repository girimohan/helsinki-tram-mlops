# Pipeline configuration. Relative paths resolve against the project root.
# Any value can be overridden with an environment variable named
# TRAM_<SECTION>_<KEY>, e.g. TRAM_INGEST_SAMPLE_INTERVAL_S=5.

[paths]
raw_dir = "data/raw"
sample_file = "data/sample/tram_sample.jsonl.gz"
processed_dir = "data/processed/positions"
gtfsrt_dir = "data/raw/gtfsrt"
predictions_dir = "data/predictions"
models_dir = "models"

[ingest]
host = "mqtt.hsl.fi"
# TLS on 8883, as HSL recommends (1883 is the unencrypted port).
port = 8883
tls = true
topic = "/hfp/v2/journey/ongoing/vp/tram/#"
# Stop and journey events, kept in full (not downsampled) in events_YYYY-MM-DD.jsonl:
# arrive at / arrive stopped / depart from / ready to depart / pass a stop, journey sign-in
# and sign-off, and traffic-light priority request / response.
events = ["arr", "ars", "dep", "pde", "pas", "vja", "vjout", "tlr", "tla"]
# HSL publishes each vehicle at ~1 Hz. Keep at most one message per vehicle
# per interval so a day of collection stays a manageable size.
sample_interval_s = 10

[gtfsrt]
# HSL's GTFS-RT feeds (https://hsldevcom.github.io/gtfs_rt/), archived by `python -m tram_mlops.gtfsrt`.
trip_updates_url = "https://realtime.hsl.fi/realtime/trip-updates/v2/hsl"
alerts_url = "https://realtime.hsl.fi/realtime/service-alerts/v2/hsl"
# Trip updates refresh every 15 s, but a trip's prediction changes only at stop events.
trip_updates_interval_s = 30
alerts_interval_s = 60
static_gtfs_url = "https://infopalvelut.storage.hsldev.com/gtfs/hsl.zip"
static_refresh_h = 24
# GTFS route types counted as trams: 0 = tram, 900 = light rail (line 15, route 2015).
tram_route_types = ["0", "900"]

[process]
timezone = "Europe/Helsinki"
# HSL punctuality window: no more than 1 min early and no more than 3 min late.
on_time_min_s = -60
on_time_max_s = 180
# Rows whose |delay| exceeds this come from vehicles still signed into a stale journey, not real lateness.
max_abs_delay_s = 1800
# Line designations that are not public service (e.g. "000" on special route 1009TX).
exclude_lines = ["000"]

[model]
# Predict a vehicle's delay this many seconds into the future.
horizon_s = 300
# Train on this many of the most recent collected days (UTC). A day is ~0.7 M rows.
train_days = 7
# A future observation must land within this many seconds of the horizon.
horizon_tolerance_s = 60
test_fraction = 0.25
min_training_rows = 200
random_state = 42
# Training loss of the gradient boosting model. The metric is MAE, which absolute error optimises
# directly. Squared error is pulled by the rare tram whose delay suddenly drops a lot, so it
# forecast recovery for trams already 5+ min late that then lost more time (roadmap E17).
loss = "absolute_error"

[evaluate]
# Backtest (python -m tram_mlops.evaluate): each test day is predicted by a model trained on
# up to this many earlier days, the same window the deployed model is trained on.
train_days = 3
# Skip test days with fewer testable rows than this (e.g. a day the collector started late).
min_test_rows = 1000

[forecast]
# The forecaster service (python -m tram_mlops.forecaster) forecasts every tram this often,
# from the last window_min minutes of collected data.
interval_s = 15
window_min = 15
# Log (and later score) at most one forecast per tram this often.
log_every_s = 30
# Don't forecast trams whose newest observation is older than this.
max_age_s = 120

[dashboard]
# Live mode reads this much recent raw data straight from the ingester's files.
live_window_min = 15
refresh_s = 15
# A tram counts as "in service now" if seen within this many seconds of the newest record.
in_service_s = 120
# Warn that the ingester may have stopped when the newest record is older than this.
stale_after_s = 120
# System page: when the stop-event file and the trip-update archive count as stale.
# Stop events are bursty at quiet hours; trip updates are polled every 30 s.
events_stale_after_s = 300
trip_updates_stale_after_s = 120
# History > Stops: arrival delay per stop from the raw stop events of this many past hours,
# for stops with at least this many arrivals.
stop_events_hours = 24
min_stop_arrivals = 5
# History view: how many days it shows by default.
history_days = 7
# Build the processed dataset on first use if it is missing. Turn off on a public server
# (TRAM_DASHBOARD_PROCESS_ON_DEMAND=false) so a page view can never start a full processing run.
process_on_demand = true

[chat]
# The dashboard's Ask page (python -m tram_mlops.chat asks from the command line). Any
# OpenAI-compatible chat API works; Groq's free tier needs no card. Get a key at
# https://console.groq.com/keys and put it in the environment variable named below.
base_url = "https://api.groq.com/openai/v1"
api_key_env = "GROQ_API_KEY"
model = "openai/gpt-oss-120b"
# Used when the first model is rate limited or fails; free-tier limits are per model.
fallback_model = "openai/gpt-oss-20b"
# gpt-oss models think before answering; "low" keeps answers quick and saves tokens. Empty = provider default.
reasoning_effort = "low"
temperature = 0.2
# Rounds of tool calls before the model must answer, and how much of each result it reads.
max_tool_rounds = 4
max_tool_result_chars = 6000
# Earlier messages sent along for follow-up questions.
history_messages = 6
max_question_chars = 500
# Groq's free tier allows about 30 requests and 8,000 tokens a minute per model, and 1,000
# requests a day; a question takes 2-3 requests. These caps keep visitors within it.
questions_per_session = 30
questions_per_minute = 6
questions_per_day = 300
timeout_s = 30
