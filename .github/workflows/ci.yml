name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt && pip install --no-deps -e .
      - run: pytest -q
      # Smoke-test the pipeline on the bundled sample.
      - run: python -m tram_mlops.process
